id: rouen_cathedral
name: Rouen Cathedral
works: "Rouen Cathedral series (1892–1894)"
best_for: [architecture, building, church, facade, city, stone]
prompt: |
  Rouen Cathedral light-study style: architecture as a surface that only exists to catch light.
  Thick, crusty, encrusted impasto built up in many layers, almost sculptural, like weathered stone.
  Stone rendered in shimmering ochre, apricot, rose and pale gold where the sun hits; cool blue-violet and turquoise in the recesses.
  Architectural lines stay recognizable but are softened and vibrating; fine ornament dissolves into dabs of light.
  The time of day is the subject — strong, unified light temperature across the whole canvas.
