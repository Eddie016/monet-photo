id: water_lilies
name: Water Lilies
works: "Water Lilies series (1897–1926) · The Japanese Footbridge (1899)"
best_for: [water, pond, lake, garden, flowers, reflection]
prompt: |
  Late Giverny Water Lilies style.
  The water surface becomes the whole picture: reflections of sky, clouds and willows melt into the water as long horizontal and vertical drags of paint.
  Lily pads as loose oval patches of jade, emerald and olive; blossoms as thick touches of rose, pale pink, white and cadmium yellow.
  Palette dominated by lilac, ultramarine, teal and deep green, with soft lavender light. Layered, scumbled, translucent glazes over thick impasto.
  Space is flattened and dreamlike, horizon minimized, atmosphere calm and meditative.
