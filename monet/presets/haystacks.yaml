id: haystacks
name: Haystacks
works: "Grainstacks series (1890–1891) · Poppy Field (1873)"
best_for: [field, countryside, farm, hills, sunset, golden hour, rural]
prompt: |
  Grainstacks series style: a simple rural motif transfigured by the light of a specific hour.
  Dense, woven, crosshatched strokes covering every part of the canvas; air itself is painted as colored texture.
  Glowing contrast between warm and cool: orange, coral and gold light against long violet-blue shadows; complementary halos around forms.
  Fields as horizontal bands of broken color; sky in soft pinks, peach and pale turquoise.
  Heavy, uniform canvas texture, matte and chalky, as if the whole scene vibrates with heat or cold.
